[project]
name = "openagenttrust"
version = "0.1.0"
description = "Open trust fabric for autonomous AI: agent identity, delegated authority, policy enforcement and independently verifiable action receipts (AgentProof)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "OpenAgentTrust contributors" }]
keywords = ["ai-agents", "security", "governance", "provenance", "policy", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]
# Runtime dependencies are pinned for repeatable builds; uv.lock pins the full tree.
dependencies = [
  "cryptography==46.0.3",
  "pydantic==2.14.1",
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
# Open Model Fabric integration: attach model-invocation evidence to receipts.
omf = ["httpx==0.28.1"]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.17.1",
  "mypy==2.4.0",
  "types-PyYAML==6.0.12.20260906",
  "pip-audit==2.10.1",
]

[project.scripts]
oat = "openagenttrust.cli:main"

[project.urls]
Homepage = "https://github.com/findajay/open-agent-trust"
Issues = "https://github.com/findajay/open-agent-trust/issues"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openagenttrust"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF", "SIM", "PT"]
ignore = [
  "S101", # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011"]
# Generated SVG markup and verbatim demo output.
"scripts/make_readme_terminal.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src"]
packages = ["openagenttrust"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[tool.coverage.run]
source = ["src/openagenttrust"]
