  <text class="ttl" x="480" y="21" text-anchor="middle">open-agent-trust: zsh</text>
  <text class="t l0 s1" x="28" y="62" xml:space="preserve"><tspan class="p">$ </tspan><tspan class="c">uv run oat demo</tspan></text>
  <rect class="cover k0" x="44" y="47" width="127" height="20"/>
  <text class="t l1 s1" x="28" y="83" xml:space="preserve"><tspan class="h">1. Identities</tspan></text>
  <text class="t l2 s1" x="28" y="104" xml:space="preserve"><tspan class="d">   acme-industries    ed25519:9SJgrgkH8u2IEpyh...</tspan></text>
  <text class="t l3 s1" x="28" y="125" xml:space="preserve"><tspan class="d">   planner-agent      ed25519:dNTuv4TaNXOPiqaM...</tspan></text>
  <text class="t l4 s1" x="28" y="146" xml:space="preserve"><tspan class="d">   maintenance-agent  ed25519:xSfHjoQjWOezfzy1...</tspan></text>
  <text class="t l5 s1" x="28" y="167" xml:space="preserve"><tspan class="d">   shift-supervisor   ed25519:pKL6zUv-XZMs1_lf...</tspan></text>
  <text class="t l6 s1" x="28" y="188" xml:space="preserve"><tspan class="d">   plant-7-gateway    ed25519:qxcFfPS5B5M-CkSh...</tspan></text>
  <text class="t l7 s1" x="28" y="209" xml:space="preserve"><tspan class="h">2. Delegation: acme-industries -&gt; planner-agent -&gt; maintenance-agent</tspan></text>
  <text class="t l8 s1" x="28" y="230" xml:space="preserve"><tspan class="h">3. Policy: read freely, restart needs a supervisor, never delete logs</tspan></text>
  <text class="t l9 s1" x="28" y="251" xml:space="preserve"><tspan class="h">4. Agent actions through the gateway</tspan></text>
  <text class="t l10 s1" x="28" y="272" xml:space="preserve"><tspan class="o">   sensor.read   plant-7/pump/P-3       </tspan><tspan class="g">allow             </tspan><tspan class="g">succeeded     </tspan><tspan class="d">01-sensor.read.json</tspan></text>
  <text class="t l11 s1" x="28" y="293" xml:space="preserve"><tspan class="o">   pump.restart  plant-7/pump/P-3       </tspan><tspan class="y">require_approval  </tspan><tspan class="g">succeeded     </tspan><tspan class="d">02-pump.restart.json</tspan></text>
  <text class="t l12 s1" x="28" y="314" xml:space="preserve"><tspan class="o">   logs.delete   plant-7/logs/2026-10   </tspan><tspan class="r">deny              </tspan><tspan class="d">not_executed  </tspan><tspan class="d">03-logs.delete.json</tspan></text>
  <text class="t l13 s1" x="28" y="335" xml:space="preserve"><tspan class="o">   pump.restart  plant-9/pump/P-1       </tspan><tspan class="r">REJECTED  </tspan><tspan class="d">no receipt (delegation link 0 does not permit ...)</tspan></text>
  <text class="t l14 s1" x="28" y="356" xml:space="preserve"><tspan class="h">5. Independent verification</tspan></text>
  <text class="t l15 s1" x="28" y="377" xml:space="preserve"><tspan class="o">   </tspan><tspan class="g">[pass]</tspan><tspan class="o"> ledger: </tspan><tspan class="d">3 receipts, chain intact</tspan></text>
  <text class="t l16 s1" x="28" y="398" xml:space="preserve"><tspan class="o">   tampered copy of the denied receipt (outcome rewritten to &#x27;succeeded&#x27;):</tspan></text>
  <text class="t l17 s1" x="28" y="419" xml:space="preserve"><tspan class="o">   </tspan><tspan class="r">[fail]</tspan><tspan class="o"> gateway-signature: </tspan><tspan class="d">receipt signature is not valid</tspan></text>
  <text class="t l18 s1" x="28" y="440" xml:space="preserve"><tspan class="o">   </tspan><tspan class="r">[fail]</tspan><tspan class="o"> enforcement: </tspan><tspan class="d">a denied request was executed</tspan></text>
  <text class="t l19 s2" x="28" y="62" xml:space="preserve"><tspan class="p">$ </tspan><tspan class="c">oat proof verify receipts/02-pump.restart.json --trust trust.json --policy policy.yaml</tspan></text>
  <rect class="cover k19" x="44" y="47" width="683" height="20"/>
  <text class="t l20 s2" x="28" y="83" xml:space="preserve"><tspan class="o"></tspan><tspan class="g">[pass]</tspan><tspan class="o"> structure: </tspan><tspan class="d">valid agentproof.receipt/v0.1</tspan></text>
  <text class="t l21 s2" x="28" y="104" xml:space="preserve"><tspan class="o"></tspan><tspan class="g">[pass]</tspan><tspan class="o"> gateway-trusted: </tspan><tspan class="d">issued by a trusted gateway</tspan></text>
  <text class="t l22 s2" x="28" y="125" xml:space="preserve"><tspan class="o"></tspan><tspan class="g">[pass]</tspan><tspan class="o"> gateway-signature: </tspan><tspan class="d">receipt signature valid</tspan></text>
  <text class="t l23 s2" x="28" y="146" xml:space="preserve"><tspan class="o"></tspan><tspan class="g">[pass]</tspan><tspan class="o"> request-digest: </tspan><tspan class="d">request_digest matches the embedded request</tspan></text>
  <text class="t l24 s2" x="28" y="167" xml:space="preserve"><tspan class="o"></tspan><tspan class="g">[pass]</tspan><tspan class="o"> agent-signature: </tspan><tspan class="d">request signed by the agent</tspan></text>
  <text class="t l25 s2" x="28" y="188" xml:space="preserve"><tspan class="o"></tspan><tspan class="g">[pass]</tspan><tspan class="o"> timing: </tspan><tspan class="d">receipt issued after the request</tspan></text>
  <text class="t l26 s2" x="28" y="209" xml:space="preserve"><tspan class="o"></tspan><tspan class="g">[pass]</tspan><tspan class="o"> delegation-chain: </tspan><tspan class="d">2-link chain from a trust anchor to the agent</tspan></text>
  <text class="t l27 s2" x="28" y="230" xml:space="preserve"><tspan class="o"></tspan><tspan class="g">[pass]</tspan><tspan class="o"> delegation-scope: </tspan><tspan class="d">every link permits the action and resource</tspan></text>
  <text class="t l28 s2" x="28" y="251" xml:space="preserve"><tspan class="o"></tspan><tspan class="g">[pass]</tspan><tspan class="o"> policy-decision: </tspan><tspan class="d">policy reproduces &#x27;require_approval&#x27;</tspan></text>
  <text class="t l29 s2" x="28" y="272" xml:space="preserve"><tspan class="o"></tspan><tspan class="g">[pass]</tspan><tspan class="o"> approval: </tspan><tspan class="d">approved by an authorised approver</tspan></text>
  <text class="t l30 s2" x="28" y="293" xml:space="preserve"><tspan class="o"></tspan><tspan class="g">[pass]</tspan><tspan class="o"> enforcement: </tspan><tspan class="d">outcome &#x27;succeeded&#x27; respects the decision</tspan></text>
  <text class="t l31 s2" x="28" y="314" xml:space="preserve"><tspan class="v">VERIFIED</tspan></text>
